<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NintiDetect Stream</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
#stream{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#status{position:fixed;left:8px;bottom:8px;color:#8cf;background:rgba(0,0,0,.65);font:11px monospace;padding:4px 6px}
</style>
</head>
<body>
<div id="wrap"><img id="stream" alt="stream"></div>
<div id="status">connecting</div>
<script>
const img=document.getElementById('stream');
const statusEl=document.getElementById('status');
function status(s){statusEl.textContent=s;}
function connect(){
  status('live');
  img.src='/stream?t='+Date.now();
}
img.addEventListener('error',()=>{
  status('reconnecting');
  setTimeout(connect,1500);
});
img.addEventListener('load',()=>status('live'));
connect();
</script>
</body>
</html>
