<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NintiDetect Stream</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
#status{position:fixed;left:8px;bottom:8px;color:#8cf;background:rgba(0,0,0,.65);font:11px monospace;padding:4px 6px}
</style>
</head>
<body>
<video id="player" muted autoplay playsinline></video>
<div id="status">connecting</div>
<script src="/jmuxer.min.js"></script>
<script>
const video=document.getElementById('player');
const statusEl=document.getElementById('status');
let ws=null;
let jmuxer=null;
let lastTsUs=0;
function status(s){statusEl.textContent=s;}
function parseWsfsFrame(buf){
  if(!buf || buf.byteLength<64)return null;
  const u8=new Uint8Array(buf);
  if(u8[0]!==0x57||u8[1]!==0x53||u8[2]!==0x46||u8[3]!==0x53)return null;
  const dv=new DataView(buf);
  const headerLen=dv.getUint16(6,false)||64;
  const payloadLen=dv.getUint32(16,false);
  const tsUs=dv.getUint32(8,false)*4294967296+dv.getUint32(12,false);
  if(headerLen<64||headerLen>buf.byteLength)return null;
  const end=payloadLen?Math.min(buf.byteLength,headerLen+payloadLen):buf.byteLength;
  return {payload:new Uint8Array(buf,headerLen,end-headerLen),tsUs};
}
function play(){
  if(ws){try{ws.close();}catch(_){} ws=null;}
  if(jmuxer){try{jmuxer.destroy();}catch(_){} jmuxer=null;}
  lastTsUs=0;
  jmuxer=new JMuxer({node:video,mode:'video',flushingTime:0,fps:5,clearBuffer:true,maxDelay:500});
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/ws/live');
  ws.binaryType='arraybuffer';
  ws.onopen=()=>status('ws live');
  ws.onerror=()=>status('ws error');
  ws.onclose=()=>{status('reconnecting');setTimeout(play,1500);};
  ws.onmessage=e=>{
    const frame=parseWsfsFrame(e.data);
    if(!frame||!frame.payload||!frame.payload.byteLength)return;
    let duration=200;
    if(lastTsUs&&frame.tsUs>lastTsUs)duration=Math.max(20,Math.min(1000,(frame.tsUs-lastTsUs)/1000));
    lastTsUs=frame.tsUs;
    try{jmuxer.feed({video:frame.payload,duration});}catch(err){status('decode error');}
    if(video.paused)video.play().catch(()=>status('tap to play'));
  };
}
video.addEventListener('click',()=>video.play().catch(()=>{}));
play();
</script>
</body>
</html>
